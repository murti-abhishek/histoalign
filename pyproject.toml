[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "histoalign"
dynamic = ["version"]
description = "Automatic, sub-micron alignment of a same-section H&E to Xenium DAPI, with a landmark-free accuracy check"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhishek Murti" }]
requires-python = ">=3.10"
keywords = ["spatial transcriptomics", "Xenium", "H&E", "image registration", "histology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "tifffile>=2023.7.10",
    "imagecodecs>=2023.3.16",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "SimpleITK>=2.3",
    "pandas>=2.0",
    "pyarrow>=12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
histoalign = "histoalign.cli:main"

[project.urls]
Homepage = "https://github.com/murti-abhishek/histoalign"
Issues = "https://github.com/murti-abhishek/histoalign/issues"

[tool.hatch.version]
path = "src/histoalign/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/histoalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fixture: needs a test dataset (see tests/README.md)"]

[tool.ruff]
line-length = 135
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E731", "E702", "B023", "B905", "UP015"]
